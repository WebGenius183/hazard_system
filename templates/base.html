<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hazard Reporting System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">

<!-- Navbar -->
<nav class="bg-white shadow-md px-6 py-4 flex justify-between items-center">
    <h1 class="text-xl font-bold text-red-600">Hazard Report System</h1>

    <div class="flex items-center space-x-4">
        {% if user.is_authenticated %}
            {% if is_supervisor %}
                <a href="{% url 'dashboard' %}" class="text-sm font-medium text-blue-600 hover:text-blue-800 transition">Dashboard</a>
                <a href="{% url 'approve_staff' %}" class="text-sm font-medium text-green-600 hover:text-green-800 transition">Approve Staff</a>
            {% else %}
                <a href="{% url 'create_report' %}" class="text-sm font-medium text-gray-700 hover:text-red-600 transition">New Report</a>
                <a href="{% url 'my_reports' %}" class="text-sm font-medium text-gray-700 hover:text-red-600 transition">My Reports</a>
            {% endif %}
            <a href="{% url 'logout' %}" class="text-sm font-medium text-red-500 hover:text-red-700 transition">Logout</a>
        {% else %}
            <a href="{% url 'login' %}" class="text-sm font-medium text-green-600 hover:text-green-800 transition">Login</a>
            <a href="{% url 'register' %}" class="text-sm font-medium text-blue-600 hover:text-blue-800 transition">Register</a>
        {% endif %}

    </div>
</nav>

<!-- Main Content -->
<main >

    {% block content %}{% endblock %}
</main>

</body>
</html>
